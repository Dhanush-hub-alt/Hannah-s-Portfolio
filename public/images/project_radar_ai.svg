<svg viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="radarSweep" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  {/* Background */}
  <rect width="800" height="450" rx="20" fill="#0A0A0A" />
  <rect x="1" y="1" width="798" height="448" rx="19" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2" />

  {/* Subtle Grid */}
  <g opacity="0.15" stroke="#FFFFFF" stroke-width="1">
    <line x1="50" y1="50" x2="750" y2="50" />
    <line x1="50" y1="150" x2="750" y2="150" />
    <line x1="50" y1="250" x2="750" y2="250" />
    <line x1="50" y1="350" x2="750" y2="350" />
    <line x1="150" y1="50" x2="150" y2="400" />
    <line x1="250" y1="50" x2="250" y2="400" />
    <line x1="400" y1="50" x2="400" y2="400" />
    <line x1="550" y1="50" x2="550" y2="400" />
    <line x1="650" y1="50" x2="650" y2="400" />
  </g>

  {/* Radar Range Rings */}
  <g stroke="#FFFFFF" stroke-opacity="0.25" stroke-dasharray="4 4" fill="none">
    <circle cx="400" cy="380" r="100" />
    <circle cx="400" cy="380" r="190" />
    <circle cx="400" cy="380" r="280" />
  </g>

  {/* Radar Pulse / Field of View Cone */}
  <path d="M400 380 L200 110 L600 110 Z" fill="url(#radarSweep)" />
  <line x1="400" y1="380" x2="200" y2="110" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.5" />
  <line x1="400" y1="380" x2="600" y2="110" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.5" />
  <line x1="400" y1="380" x2="400" y2="100" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="2 2" />

  {/* Detected Ahead Vehicle Silhouette */}
  <g transform="translate(365, 170)">
    <rect width="70" height="42" rx="8" fill="#1C1C1E" stroke="#FFFFFF" stroke-width="1.5" />
    <rect x="15" y="8" width="40" height="20" rx="4" fill="#2C2C2E" stroke="#FFFFFF" stroke-opacity="0.4" />
    <circle cx="20" cy="38" r="4" fill="#FFFFFF" />
    <circle cx="50" cy="38" r="4" fill="#FFFFFF" />
    {/* Detection Target Box */}
    <rect x="-10" y="-8" width="90" height="58" rx="4" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="4 3" />
    <text x="88" y="10" font-family="'Manrope', monospace" font-size="11" font-weight="700" fill="#FFFFFF">TARGET 01</text>
    <text x="88" y="24" font-family="'Manrope', monospace" font-size="9" fill="#A1A1AA">DIST: 42.6 m</text>
    <text x="88" y="36" font-family="'Manrope', monospace" font-size="9" fill="#A1A1AA">VEL: -14 km/h</text>
  </g>

  {/* Sensor Module & Host Vehicle */}
  <g transform="translate(370, 350)">
    <rect width="60" height="50" rx="10" fill="#FFFFFF" />
    <rect x="8" y="8" width="44" height="18" rx="4" fill="#000000" />
    <text x="30" y="21" font-family="'Manrope', sans-serif" font-size="8" font-weight="800" fill="#FFFFFF" text-anchor="middle">77 GHz</text>
    <text x="30" y="40" font-family="'Manrope', sans-serif" font-size="7" font-weight="700" fill="#000000" text-anchor="middle">mmWAVE</text>
  </g>

  {/* Top HUD Telemetry Overlay */}
  <g transform="translate(30, 25)">
    <rect width="180" height="42" rx="8" fill="#141414" stroke="#FFFFFF" stroke-opacity="0.15" />
    <circle cx="16" cy="21" r="5" fill="#FFFFFF" />
    <text x="28" y="18" font-family="'Manrope', monospace" font-size="10" font-weight="800" fill="#FFFFFF">EDGE FUSION RADAR</text>
    <text x="28" y="32" font-family="'Manrope', monospace" font-size="9" fill="#71717A">ESP32 + RASPBERRY PI</text>
  </g>

  <g transform="translate(590, 25)">
    <rect width="180" height="42" rx="8" fill="#141414" stroke="#FFFFFF" stroke-opacity="0.15" />
    <text x="16" y="18" font-family="'Manrope', monospace" font-size="10" font-weight="800" fill="#FFFFFF">VISIBILITY INDEX</text>
    <text x="16" y="32" font-family="'Manrope', monospace" font-size="9" fill="#A1A1AA">OPTICAL ATTENUATION: 0.28</text>
  </g>

  {/* Collision Avoidance Threshold Indicator */}
  <g transform="translate(30, 390)">
    <rect width="210" height="34" rx="6" fill="#171717" stroke="#FFFFFF" stroke-opacity="0.2" />
    <text x="12" y="21" font-family="'Manrope', monospace" font-size="9" font-weight="700" fill="#FFFFFF">SAFETY BUFFER: EXPANDED (FOG)</text>
  </g>
</svg>
