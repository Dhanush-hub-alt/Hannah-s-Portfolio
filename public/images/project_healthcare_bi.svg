<svg viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  {/* Dark Dashboard Canvas */}
  <rect width="800" height="450" rx="20" fill="#0A0A0A" />
  <rect x="1" y="1" width="798" height="448" rx="19" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2" />

  {/* Header Ribbon */}
  <rect x="30" y="24" width="740" height="50" rx="10" fill="#141414" stroke="#FFFFFF" stroke-opacity="0.1" />
  <circle cx="55" cy="49" r="6" fill="#FFFFFF" />
  <text x="72" y="46" font-family="'Manrope', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">POWER BI CLINICAL INTELLIGENCE SUITE</text>
  <text x="72" y="60" font-family="'Manrope', monospace" font-size="9" fill="#71717A">HEALTH METRIC TREND MONITORING &amp; ANOMALY DETECTION (DAX)</text>
  
  <rect x="640" y="36" width="115" height="26" rx="6" fill="#202020" stroke="#FFFFFF" stroke-opacity="0.2" />
  <text x="697" y="53" font-family="'Manrope', monospace" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">LIVE COHORT</text>

  {/* Metric Cards Top Row */}
  {/* Card 1 */}
  <g transform="translate(30, 90)">
    <rect width="170" height="85" rx="10" fill="#141414" stroke="#FFFFFF" stroke-opacity="0.1" />
    <text x="16" y="24" font-family="'Manrope', sans-serif" font-size="9" font-weight="700" fill="#71717A">HEALTH INDICATORS</text>
    <text x="16" y="52" font-family="'Manrope', sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">Multi-Var</text>
    <text x="16" y="70" font-family="'Manrope', monospace" font-size="9" fill="#A1A1AA">Normalized Scale</text>
  </g>

  {/* Card 2 */}
  <g transform="translate(220, 90)">
    <rect width="170" height="85" rx="10" fill="#141414" stroke="#FFFFFF" stroke-opacity="0.1" />
    <text x="16" y="24" font-family="'Manrope', sans-serif" font-size="9" font-weight="700" fill="#71717A">DAX DEVIATION</text>
    <text x="16" y="52" font-family="'Manrope', sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">± 2.45 σ</text>
    <text x="16" y="70" font-family="'Manrope', monospace" font-size="9" fill="#A1A1AA">Dynamic Window</text>
  </g>

  {/* Card 3 */}
  <g transform="translate(410, 90)">
    <rect width="170" height="85" rx="10" fill="#141414" stroke="#FFFFFF" stroke-opacity="0.1" />
    <text x="16" y="24" font-family="'Manrope', sans-serif" font-size="9" font-weight="700" fill="#71717A">ANOMALY FLAGS</text>
    <text x="16" y="52" font-family="'Manrope', sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">Validated</text>
    <text x="16" y="70" font-family="'Manrope', monospace" font-size="9" fill="#A1A1AA">Threshold Check</text>
  </g>

  {/* Card 4 */}
  <g transform="translate(600, 90)">
    <rect width="170" height="85" rx="10" fill="#141414" stroke="#FFFFFF" stroke-opacity="0.1" />
    <text x="16" y="24" font-family="'Manrope', sans-serif" font-size="9" font-weight="700" fill="#71717A">CLINICAL REPORTS</text>
    <text x="16" y="52" font-family="'Manrope', sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">Interactive</text>
    <text x="16" y="70" font-family="'Manrope', monospace" font-size="9" fill="#A1A1AA">Drill-Down Active</text>
  </g>

  {/* Longitudinal Trend Chart (Main Area) */}
  <g transform="translate(30, 190)">
    <rect width="470" height="235" rx="12" fill="#121212" stroke="#FFFFFF" stroke-opacity="0.12" />
    <text x="20" y="28" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">PATIENT HEALTH METRIC LONGITUDINAL VARIANCE</text>
    <text x="20" y="44" font-family="'Manrope', monospace" font-size="9" fill="#71717A">Historical baseline against moving average tracking</text>

    {/* Horizontal Chart Grid */}
    <line x1="30" y1="80" x2="440" y2="80" stroke="#FFFFFF" stroke-opacity="0.06" />
    <line x1="30" y1="120" x2="440" y2="120" stroke="#FFFFFF" stroke-opacity="0.06" />
    <line x1="30" y1="160" x2="440" y2="160" stroke="#FFFFFF" stroke-opacity="0.06" />
    <line x1="30" y1="200" x2="440" y2="200" stroke="#FFFFFF" stroke-opacity="0.1" />

    {/* Baseline Wave */}
    <path d="M40 150 Q90 130 140 145 T240 130 T340 140 T440 120" stroke="#71717A" stroke-width="1.5" stroke-dasharray="3 3" fill="none" />
    
    {/* Dynamic Waveform */}
    <path d="M40 160 Q80 140 120 110 T200 135 T280 80 T360 145 T440 100" stroke="#FFFFFF" stroke-width="2.5" fill="none" />
    
    {/* Outlier Alert Dot */}
    <circle cx="280" cy="80" r="6" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
    <rect x="250" y="52" width="60" height="20" rx="4" fill="#FFFFFF" />
    <text x="280" y="65" font-family="'Manrope', monospace" font-size="8" font-weight="800" fill="#000000" text-anchor="middle">ANOMALY</text>
  </g>

  {/* Anomaly Breakdown / Distribution Bar Panel */}
  <g transform="translate(520, 190)">
    <rect width="250" height="235" rx="12" fill="#121212" stroke="#FFFFFF" stroke-opacity="0.12" />
    <text x="18" y="28" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">DAX VARIANCE DISTRIBUTION</text>
    
    {/* Vertical Metric Bars */}
    <g transform="translate(20, 60)">
      <rect x="0" y="40" width="30" height="110" rx="4" fill="#3F3F46" />
      <rect x="50" y="20" width="30" height="130" rx="4" fill="#71717A" />
      <rect x="100" y="70" width="30" height="80" rx="4" fill="#27272A" />
      <rect x="150" y="10" width="30" height="140" rx="4" fill="#FFFFFF" />
      
      <text x="15" y="165" font-family="'Manrope', monospace" font-size="8" fill="#71717A" text-anchor="middle">BP</text>
      <text x="65" y="165" font-family="'Manrope', monospace" font-size="8" fill="#71717A" text-anchor="middle">GLU</text>
      <text x="115" y="165" font-family="'Manrope', monospace" font-size="8" fill="#71717A" text-anchor="middle">PULSE</text>
      <text x="165" y="165" font-family="'Manrope', monospace" font-size="8" fill="#FFFFFF" text-anchor="middle">INDEX</text>
    </g>
  </g>
</svg>
